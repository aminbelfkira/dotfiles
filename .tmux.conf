# Souris : sélectionner/redimensionner les panneaux et faire défiler
set -g mouse on

# Conserver davantage de lignes dans l’historique
set -g history-limit 50000

# Numéroter fenêtres et panneaux à partir de 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Couleurs modernes
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"

# Comportement agréable avec Neovim
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi

# Créer fenêtres et panneaux dans le dossier courant
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Recharger cette configuration avec Ctrl-b puis r
bind r source-file ~/.tmux.conf \; display-message "Configuration rechargee"

# Navigation transparente entre tmux et Neovim
bind-key -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind-key -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind-key -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind-key -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"
